name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Find firmware binary
        id: findbin
        run: |
          BIN_PATH=$(find .pio/build -type f -name "firmware.bin" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "No firmware.bin found"
            exit 1
          fi
          echo "bin_path=$BIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload .bin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.findbin.outputs.bin_path }}