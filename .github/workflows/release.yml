name: Release Firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # PlatformIO envs are defined explicitly in platformio.ini. The board
      # the updater refers to as "pico" is built by the [env:esp32-pico]
      # environment (board = pico32), so both supported boards are built
      # here by name rather than relying on the default "pio run" behavior.
      - name: Build firmware (esp32-pico and esp32-c3)
        run: |
          pio run -e esp32-pico -e esp32-c3

      - name: Collect release assets
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_asset() {
            local env_name="$1"
            local board_tag="$2"
            local src=".pio/build/${env_name}/firmware.bin"
            local dest="release-assets/firmware-${board_tag}.bin"

            if [ ! -f "$src" ]; then
              echo "::error::Expected firmware binary '$src' for env '$env_name' (board '$board_tag') was not produced by the build."
              exit 1
            fi
            cp "$src" "$dest"
            echo "Collected: $dest"
          }

          copy_asset "esp32-pico" "esp32pico"
          copy_asset "esp32-c3" "esp32c3"

          echo "Final release assets:"
          ls -la release-assets

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/*