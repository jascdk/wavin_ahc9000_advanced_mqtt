; platformio.ini

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
    tzapu/WiFiManager @ ^2.0.17
    jandrassy/TelnetStream @ 1.3.0

[env:esp32-pico]
; for use with rev.1 board from Mogens Groth Nicolaisen https://github.com/nic6911/ESP32_Modbus_Module
board = pico32
; Enable PSRAM
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0

[env:esp32-c3]
; for use with rev.2 board from Mogens Groth Nicolaisen https://github.com/nic6911/ESP32_Modbus_Module
board = esp32-c3-devkitm-1
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
